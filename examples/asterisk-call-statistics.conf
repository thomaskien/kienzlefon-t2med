; Reference only: include this file and connect the EXTERNAL ingress hooks explicitly.
; Requires func_uuid and app_userevent. Never add the entry hook to internal targets.
; At each external PRACTICE PHONE ingress, before capacity checks/Answer/IVR:
;   Gosub(kienzlefon-statistics-entry,s,1(practice-1))
; At a selected/reached route (same channel or inherited child):
;   Gosub(kienzlefon-statistics-route,s,1(queue))

[kienzlefon-statistics-entry]
exten => s,1,GotoIf($["${KF_STATS_CALL_ID}"!=""]?done)
 same => n,GotoIf($[${REGEX("^[A-Za-z0-9_.-]{1,64}$" ${ARG1})}=0]?done)
 same => n,Set(__KF_STATS_PBX_ID=${ARG1})
 same => n,Set(__KF_STATS_ENTERED_AT=${EPOCH})
 same => n,Set(__KF_STATS_CALL_ID=${UUID()})
 same => n,GotoIf($["${KF_STATS_CALL_ID}"=""]?done)
 same => n,UserEvent(KienzlefonCallEntered,SchemaVersion: 1,PbxId: ${KF_STATS_PBX_ID},CallId: ${KF_STATS_CALL_ID},EnteredAt: ${KF_STATS_ENTERED_AT})
 same => n(done),Return()

[kienzlefon-statistics-route]
exten => s,1,GotoIf($["${KF_STATS_CALL_ID}"=""]?done)
 same => n,GotoIf($[${REGEX("^(ivr|ai|queue|prescription|referral|appointment|callback|other|opening_hours|pharmacy|specialist)$" ${ARG1})}=0]?done)
 same => n,UserEvent(KienzlefonCallRoute,SchemaVersion: 1,PbxId: ${KF_STATS_PBX_ID},CallId: ${KF_STATS_CALL_ID},EnteredAt: ${KF_STATS_ENTERED_AT},Route: ${ARG1})
 same => n(done),Return()
