name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, pdo_sqlite
          tools: composer
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - run: go test ./... && go vet ./...
        working-directory: fhir-importer
      - run: find src bin installer -name '*.php' -exec php -l {} \;
      - run: php tests/php/run.php
      - run: php tests/installer/run.php
      - run: python3 -m unittest discover -s tests/installer -v
      - run: python3 -m unittest discover -s tests/clients -v
      - run: python3 -m unittest discover -s tests/integration -v
      - run: bash -n installer/install.sh clients/install-linux.sh clients/install-macos.sh
      - run: bash installer/install.sh --dry-run

  macos-client:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests/clients -v
      - run: sh -n clients/install-macos.sh clients/macos-bundle.sh

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/ui/compact.cjs
      - run: node tests/ui/fhir.cjs
